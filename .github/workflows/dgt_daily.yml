name: Automated Bulletproof DGT Data Ingestion

on:
  schedule:
    # Prime morning checks every 30 mins: 08:00 to 11:30 UTC (10:00 to 13:30 CEST Spain)
    - cron: '0,30 8,9,10,11 * * *'
    # Afternoon & evening safety backups: 14:30, 18:30 UTC (16:30, 20:30 CEST Spain)
    - cron: '30 14,18 * * *'
  workflow_dispatch: # Manual trigger anytime from GitHub Actions UI

concurrency:
  group: dgt-ingestion-lock
  cancel-in-progress: false

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary pandas

      - name: Execute Resilient DGT Extraction & Database Sync
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          python agents/extractor/dgt_spain.py --catchup 10
