name: Automated Bulletproof DGT Data Ingestion

on:
  schedule:
    # 4 Retries daily (Monday to Sunday) at 07:30, 10:30, 14:30, 18:30 UTC (09:30, 12:30, 16:30, 20:30 CET)
    - cron: '30 7,10,14,18 * * *'
  workflow_dispatch: # Manual trigger anytime from GitHub Actions UI

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary pandas

      - name: Execute Resilient DGT Extraction & Database Sync
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          python agents/extractor/dgt_spain.py --catchup 10
