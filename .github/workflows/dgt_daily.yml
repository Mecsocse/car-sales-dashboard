name: Automated Bulletproof DGT Data Ingestion

on:
  schedule:
    # 4 Reintentos diarios (Lunes-Viernes) a las 09:30, 12:30, 16:30, 20:30 CET
    - cron: '30 7,10,14,18 * * 1-5'
  workflow_dispatch:

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary pandas sqlite3-to-sqlite

      - name: Execute Resilient DGT Extraction & Database Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DATABASE_URL }}
        run: |
          python scripts/run_pipeline.py
