name: Daily DGT Auto Ingestion

on:
  schedule:
    # High-frequency morning window (07:15 to 07:55 UTC = 09:15 to 09:55 CEST) Monday-Friday
    - cron: '15,25,35,45,55 7 * * 1-5'
    # Safety checks at 08:15 UTC (10:15 CEST) and 16:30 UTC (18:30 CEST)
    - cron: '15 8,16 * * 1-5'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary pandas

      - name: Run Auto Catchup Daily Ingest
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          python agents/extractor/dgt_spain.py --catchup 5

      - name: Wake up & sync Render backend
        run: |
          curl -s -m 15 "https://car-sales-api-jafd.onrender.com/api/admin/trigger-ingest?days=3" || true
