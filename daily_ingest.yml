name: Daily DGT Auto Ingestion

on:
  schedule:
    # Runs daily at 07:30 AM UTC and 17:30 PM UTC
    - cron: '30 7,17 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas psycopg2-binary fastapi uvicorn pydantic

      - name: Run Auto Catchup Daily Ingest
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          python agents/extractor/dgt_spain.py
